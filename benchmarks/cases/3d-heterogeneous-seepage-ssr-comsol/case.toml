[case]
name = "3d-heterogeneous-seepage-ssr-comsol"
title = "3D heterogeneous seepage SSR COMSOL"
tags = ["3d", "p2", "mechanics", "ssr", "seepage-coupled"]

[mesh]
asset = "3d_hetero_seepage_transition"
variant = "transition_default"
element = "P2"
refine_levels = 0
partitioner = "parmetis"
profile = "fixed_base"

[physics.mechanics]
model = "mohr_coulomb_ssr"
davis = "B"

[physics.seepage]
model = "darcy"

[continuation]
profile = "indirect-classic"
omega_max = 340700000.0
lambda_init = 1.0
d_lambda_init = 0.1
d_lambda_min = 1e-05
d_lambda_diff_scaled_min = 0.005
step_max = 100

[newton]
profile = "indirect-regularized"
it_max = 50
it_damp_max = 10
tol = 0.0001
r_min = 0.0001

[linear]
profile = "baseline-pmg-deflated"
tolerance = 0.1
max_iterations = 100

[seepage]
linear_tolerance = 1e-10
linear_max_iter = 500

[output]
solution = ["vtu", "petscbin"]
history = ["summary_json", "curve_csv"]

[notebook]
family = "3d_seepage_continuation"
slice_planes_y = [35.0]
slice_planes_z = [1e-16, 21.6506]
strain_clim_scale_max = 0.25

[case]
name = "3d-heterogeneous-ssr-p2"
title = "3D heterogeneous SSR"
tags = ["3d", "p2", "mechanics", "ssr"]

[mesh]
asset = "3d_hetero_slope"
variant = "adaptive_family_a_l1"
element = "P2"
refine_levels = 0
partitioner = "parmetis"

[physics.mechanics]
model = "mohr_coulomb_ssr"
davis = "B"

[continuation]
profile = "indirect-classic"
omega_max = 12000000.0
lambda_init = 1.0
d_lambda_init = 0.1
d_lambda_min = 0.001
d_lambda_diff_scaled_min = 0.001
step_max = 100

[newton]
profile = "indirect-regularized"
it_max = 200
it_damp_max = 10
tol = 0.0001
r_min = 0.0001

[linear]
profile = "baseline-pmg-deflated"
tolerance = 0.1
max_iterations = 100

[output]
solution = ["vtu", "petscbin"]
history = ["summary_json", "curve_csv"]

[notebook]
family = "3d_continuation"
slice_planes_y = [35.0]
slice_planes_z = [43.30127019, 64.95190529]
strain_clim_scale_max = 0.25

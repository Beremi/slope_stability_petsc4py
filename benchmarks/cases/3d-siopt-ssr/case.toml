[case]
name = "3d-siopt-ssr"
title = "3D SIOPT SSR"
tags = ["3d", "p2", "mechanics", "ssr"]

[mesh]
asset = "3d_siopt"
variant = "reference_l0"
element = "P2"
refine_levels = 0
partitioner = "parmetis"
profile = "fixed_base"

[physics.mechanics]
model = "mohr_coulomb_ssr"
davis = "B"

[continuation]
profile = "indirect-classic"
omega_max = 36000000.0
lambda_init = 0.9
d_lambda_init = 0.1
d_lambda_min = 0.001
d_lambda_diff_scaled_min = 0.001
step_max = 100

[newton]
profile = "indirect-regularized"
it_max = 40
it_damp_max = 10
tol = 1e-05
r_min = 1e-06

[linear]
profile = "baseline-pmg-deflated"
tolerance = 0.1
max_iterations = 200

[output]
solution = ["vtu", "petscbin"]
history = ["summary_json", "curve_csv"]

[notebook]
family = "3d_continuation"
slice_planes_y = [30.0]
slice_planes_z = [43.30127019]
strain_clim_scale_max = 0.25

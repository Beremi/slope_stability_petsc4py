[benchmark]
title = "2D Kozinec LL"
matlab_script = "slope_stability_2D_Kozinec_LL.m"
comparison_kind = "continuation"
mpi_ranks = 8
suite = false

[problem]
name = "slope_stability_2D_Kozinec_LL"
asset = "2d_kozinec"
mesh_variant = "default.msh"
analysis = "ll"
dimension = 2
variant = "hetero"
elem_type = "P2"
davis_type = "B"
seepage = false

[execution]
node_ordering = "none"
mpi_distribute_by_nodes = true
constitutive_mode = "overlap"

[continuation]
method = "indirect"
lambda_ell = 1.0
d_t_min = 1e-3
d_omega_ini_scale = 0.03333333333333333
omega_max = 200000.0
step_max = 100

[newton]
it_max = 200
it_damp_max = 10
tol = 1e-4
r_min = 1e-4

[linear_solver]
solver_type = "PETSC_MATLAB_DFGMRES_HYPRE_NULLSPACE"
tolerance = 1e-1
max_iterations = 100
pc_hypre_coarsen_type = "HMIS"
pc_hypre_interp_type = "ext+i"
recycle_preconditioner = true

[export]
write_custom_debug_bundle = true
write_history_json = true
write_solution_vtu = true

[notebook]
family = "2d_continuation"

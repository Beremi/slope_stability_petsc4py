[benchmark]
title = "P4(L1) PETSc AIJ MATIS/BDDC local-GAMG probe"
matlab_script = "slope_stability_3D_hetero_SSR.m"
comparison_kind = "continuation"
mpi_ranks = 32
suite = false

[problem]
name = "p4_l1_petsc_aij_bddc_gamg"
asset = "3d_hetero_slope"
mesh_variant = "adaptive_family_a_l1.msh"
analysis = "ssr"
elem_type = "P4"
davis_type = "B"

[execution]
node_ordering = "block_metis"
mpi_distribute_by_nodes = true
constitutive_mode = "overlap"
tangent_kernel = "rows"
tangent_matrix_backend = "petsc_aij_element"

[continuation]
method = "indirect"
lambda_init = 1.0
d_lambda_init = 0.1
d_lambda_min = 1e-3
d_lambda_diff_scaled_min = 1e-3
omega_max = 7.0e6
init_newton_stopping_criterion = "relative_correction"
init_newton_stopping_tol = 1e-3
step_max = 100

[newton]
it_max = 200
it_damp_max = 10
tol = 1e-4
r_min = 1e-4
stopping_criterion = "absolute_delta_lambda"
stopping_tol = 1e-4

[linear_solver]
solver_type = "PETSC_MATLAB_DFGMRES_GAMG_NULLSPACE"
tolerance = 1e-1
max_iterations = 100
deflation_basis_tolerance = 1e-3
threads = 1
print_level = 0
use_as_preconditioner = true
compiled_outer = false
recycle_preconditioner = true
pc_backend = "bddc"
preconditioner_matrix_source = "tangent"
preconditioner_matrix_policy = "current"
preconditioner_rebuild_policy = "every_newton"
pc_bddc_symmetric = false
pc_bddc_dirichlet_ksp_type = "preonly"
pc_bddc_dirichlet_pc_type = "gamg"
pc_bddc_neumann_ksp_type = "preonly"
pc_bddc_neumann_pc_type = "gamg"
pc_bddc_coarse_ksp_type = "preonly"
pc_bddc_coarse_pc_type = "lu"
pc_bddc_dirichlet_approximate = true
pc_bddc_neumann_approximate = true
pc_bddc_switch_static = true
pc_bddc_use_vertices = true
pc_bddc_use_edges = true
pc_bddc_use_faces = true
pc_bddc_use_deluxe_scaling = false
pc_bddc_use_change_of_basis = false
pc_bddc_use_change_on_faces = false
pc_bddc_check_level = 0
petsc_opt = [
  "pc_bddc_dirichlet_pc_gamg_type=agg",
  "pc_bddc_neumann_pc_gamg_type=agg",
  "pc_bddc_dirichlet_pc_gamg_threshold=0.05",
  "pc_bddc_neumann_pc_gamg_threshold=0.05",
  "pc_bddc_dirichlet_pc_gamg_aggressive_coarsening=1",
  "pc_bddc_neumann_pc_gamg_aggressive_coarsening=1",
  "pc_bddc_dirichlet_mg_levels_ksp_type=chebyshev",
  "pc_bddc_neumann_mg_levels_ksp_type=chebyshev",
  "pc_bddc_dirichlet_mg_levels_ksp_max_it=1",
  "pc_bddc_neumann_mg_levels_ksp_max_it=1"
]

[export]
write_custom_debug_bundle = false
write_history_json = true
write_solution_vtu = false

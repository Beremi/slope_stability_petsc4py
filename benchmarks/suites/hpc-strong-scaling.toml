[suite]
id = "hpc-strong-scaling"
title = "HPC strong-scaling sweep"
cases = ["3d-heterogeneous-ssr-p4"]
profiles = ["pmg-deflated-baseline"]
ranks = [32, 64, 128, 256]
repeats = 3
timeout = "01:00:00"

[resources.karolina]
machine = "karolina"
max_ranks = 256
nodes = 2
ranks_per_node = 128
partition = "qcpu"
launcher = "mpiexec"
time_limit = "01:00:00"

[environment]
OMP_NUM_THREADS = "1"

[overrides.continuation]
step_max = 100

[overrides.output]
preset = "performance"

[collect]
petsc_log_view = true
options_view = true
options_left = true
environment = true
resolved_manifest = true

[suite]
id = "local-32-strong-scaling"
title = "Local 32-core strong-scaling sweep"
cases = ["3d-heterogeneous-ssr-p4"]
profiles = ["pmg-deflated-baseline"]
ranks = [1, 2, 4, 8, 16, 32]
repeats = 3
timeout = "00:45:00"

[resources.local]
machine = "local-32-core"
cores = 32
max_ranks = 32
launcher = "mpiexec"
time_limit = "00:45:00"

[environment]
OMP_NUM_THREADS = "1"

[overrides.continuation]
step_max = 20

[collect]
petsc_log_view = true
options_view = true
options_left = true
environment = true
resolved_manifest = true

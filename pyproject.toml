[build-system]
requires = ["setuptools", "wheel", "Cython>=3.0", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "petsc-ssr"
version = "0.1.0"
description = "Self-contained PETSc-owned Python/C slope-stability SSR engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "mpi4py>=4.0", "petsc4py>=3.24,<3.25"]

[project.optional-dependencies]
mesh = ["meshio>=5.3"]
hdf5 = ["h5py>=3.8"]
reports = ["h5py>=3.8", "matplotlib>=3.7"]
seepage = ["scipy>=1.10"]
notebooks = [
  "nbformat>=5.9",
  "nbclient>=0.8",
  "pyvista>=0.43",
  "ipywidgets>=8.0",
  "matplotlib>=3.7",
  "meshio>=5.3",
  "scipy>=1.10",
  "h5py>=3.8",
]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
petsc-ssr = "petsc_ssr.cli.main:main"
petsc-ssr-run-case = "petsc_ssr.runners.run_case_from_config:main"
petsc-ssr-local = "petsc_ssr.runners.local_case:main"
petsc-ssr-seepage = "petsc_ssr.runners.comsol_seepage:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["petsc_ssr*"]

[tool.setuptools.package-data]
petsc_ssr = ["py.typed", "native/cython/*.pyx", "native/include/*", "native/*/*"]

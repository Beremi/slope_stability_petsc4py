[study]
name = "heterogeneous_3d_ssr_integration_point_study"
mesh_path = "meshes/3d_hetero_ssr/SSR_hetero_ada_L1.msh"
artifact_dir = "artifacts/heterogeneous_3d_ssr_integration_point_study"
report_basename = "heterogeneous_3d_ssr_integration_point_study"
mpi_ranks = 8
omp_threads = 1
element_types = ["P1", "P2", "P4"]
reference_quadrature_rule = 45
omega_final = 6.7e6
default_timeout_seconds = 1200

[study.quadrature_matrix]
P1 = [1, 4, 11, 24, 45]
P2 = [4, 11, 24, 45]
P4 = [24, 45]

[study.timeout_seconds_by_element]
P4 = "null"

[continuation]
lambda_init = 1.0
d_lambda_init = 1.0e-1
d_lambda_min = 1.0e-3
d_lambda_diff_scaled_min = 1.0e-4
step_max = 100
predictor = "secant"
omega_step_controller = "legacy"

[newton]
it_max = 200
it_damp_max = 10
tol = 1.0e-4
r_min = 1.0e-4
stopping_criterion = "absolute_delta_lambda"
stopping_tol = 1.0e-4
init_stopping_criterion = "relative_residual"
init_stopping_tol = 1.0e-4

[linear_solver]
solver_type = "PETSC_MATLAB_DFGMRES_HYPRE_NULLSPACE"
tolerance = 1.0e-1
max_iterations = 100
pc_backend = "hypre"
preconditioner_threads = 1

[execution]
node_ordering = "block_metis"
mpi_distribute_by_nodes = true
constitutive_mode = "overlap"
recycle_preconditioner = true
store_step_u = false
